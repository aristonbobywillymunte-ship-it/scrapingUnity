services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-app_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    depends_on:
      - postgres
      - redis
    networks:
      - internal_net

  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      - app
    networks:
      - internal_net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${DB_DATABASE:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - internal_net

  redis:
    image: redis:alpine
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - internal_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      - .:/var/www/html
    command: php /var/www/html/artisan queue:work
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - postgres
      - redis
    networks:
      - internal_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      - .:/var/www/html
    command: php /var/www/html/artisan schedule:work
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    depends_on:
      - postgres
      - redis
    networks:
      - internal_net

  python_http_worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - redis
    networks:
      - internal_net

  python_browser_worker:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
    depends_on:
      - redis
    networks:
      - internal_net

  python_validator_worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python3 worker_validator.py
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    depends_on:
      - redis
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata:
