services:
  app:
    image: php:8.2-fpm
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
  
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine

  queue:
    image: php:8.2-cli
    volumes:
      - .:/var/www/html
    command: php /var/www/html/artisan queue:work
    depends_on:
      - postgres
      - redis

  scheduler:
    image: php:8.2-cli
    volumes:
      - .:/var/www/html
    command: php /var/www/html/artisan schedule:work
    depends_on:
      - postgres
      - redis

  toolsscraping_build_raw_pg_test:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_raw
    ports:
      - "5433:5432"

  toolsscraping_build_laravel_pg_test:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_laravel
    ports:
      - "5434:5432"
