components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Bearer API Key
    SessionAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: Secure Authenticated Session (Cookie) + CSRF
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    CursorPaginationMeta:
      type: object
      properties:
        limit:
          type: integer
        cursor:
          type: string
        next_cursor:
          type: string
        has_more:
          type: boolean
    RunStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - COMPLETED
      - PARTIAL
      - FAILED
      - CANCELLED
    TaskStatus:
      type: string
      enum:
      - QUEUED
      - LEASED
      - RUNNING
      - RETRY_WAIT
      - COMPLETED
      - FAILED
      - CANCELLED
    ServiceStatus:
      type: string
      enum:
      - NORMAL
      - LIMITED
      - DEGRADED
      - MAINTENANCE
      - UNAVAILABLE
    ExportStatus:
      type: string
      enum:
      - QUEUED
      - PROCESSING
      - READY
      - EXPIRED
      - FAILED
    RefundStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    SelectorVersionStatus:
      type: string
      enum:
      - DRAFT
      - TESTING
      - ACTIVE
      - INACTIVE
      - DEPRECATED
    NotificationDeliveryStatus:
      type: string
      enum:
      - QUEUED
      - SENDING
      - DELIVERED
      - FAILED
    IncidentSeverity:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    IncidentStatus:
      type: string
      enum:
      - INVESTIGATING
      - IDENTIFIED
      - MONITORING
      - RESOLVED
    ResourceHealthStatus:
      type: string
      enum:
      - HEALTHY
      - DEGRADED
      - UNHEALTHY
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
    UserSummary:
      type: object
      properties:
        id:
          type: string
